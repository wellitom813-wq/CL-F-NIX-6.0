<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070706">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Clã Fênix</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    .not-found{min-height:100dvh;display:grid;place-items:center;padding:30px}
    .not-found-card{width:min(650px,100%);text-align:center;padding:58px 30px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,var(--panel),#090806);box-shadow:var(--shadow)}
    .not-found-mark{width:90px;height:90px;margin:0 auto 25px;display:grid;place-items:center;border-radius:26px;background:linear-gradient(145deg,var(--accent-2),var(--primary-2));color:#1c1205;font-weight:1000;font-size:40px;box-shadow:0 0 35px rgba(242,199,103,.16);transform:rotate(45deg)}
    .not-found-mark span{transform:rotate(-45deg)}
    .not-found h1{font-size:clamp(38px,8vw,67px);line-height:.95;letter-spacing:-.05em;margin:0}
    .not-found p{color:var(--muted);max-width:460px;margin:18px auto 28px}
  </style>
</head>
<body>
  <main class="not-found">
    <section class="not-found-card">
      <div class="not-found-mark"><span>F</span></div>
      <span class="eyebrow">ERRO 404</span>
      <h1>Essa vila não foi encontrada.</h1>
      <p>O endereço pode ter mudado ou a página não existe. Volte para o portal oficial do Clã Fênix.</p>
      <a class="btn btn-primary btn-large" href="/">VOLTAR AO CLÃ FÊNIX →</a>
    </section>
  </main>
</body>
</html>
